name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 别用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 新 runner 的 cmdline-tools 已经没有这个包，会直接 exit 1，编译都没开始就失败。
      # runner 镜像本来就带 Android SDK，这里只固定路径 + 过一遍许可。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CT=""
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK"/cmdline-tools/*/bin; do
            if [ -x "$d/sdkmanager" ]; then CT="$d"; break; fi
          done
          if [ -n "$CT" ]; then
            echo "$CT" >> "$GITHUB_PATH"
            yes | "$CT/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          ls "$SDK" | head -n 12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colorless-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
